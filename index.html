<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MONEA</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#7a2e4a">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Journal">

<style>
/* =========================================================
   LOCAL FONTS
   ========================================================= */

@font-face{
  font-family:"DM Sans";
  src:url("./fonts/DMSans-Regular.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"DM Sans";
  src:url("./fonts/DMSans-Medium.woff2") format("woff2");
  font-weight:500;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"DM Sans";
  src:url("./fonts/DMSans-SemiBold.woff2") format("woff2");
  font-weight:600;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"Cormorant Garamond";
  src:url("./fonts/CormorantGaramond-Medium.woff2") format("woff2");
  font-weight:500;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"Cormorant Garamond";
  src:url("./fonts/CormorantGaramond-SemiBold.woff2") format("woff2");
  font-weight:600;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"Cormorant Garamond";
  src:url("./fonts/CormorantGaramond-Bold.woff2") format("woff2");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

/* =========================================================
   DESIGN
   ========================================================= */

:root{
  --bg:#faf5ee;
  --card:#fffdf9;
  --ink:#3d2a2f;
  --mute:#8a7670;
  --rose:#c98d97;
  --blush:#f5e3e3;
  --mauve:#a9818f;
  --berry:#7a2e4a;
  --beige:#efe4d6;
  --line:#ead9d0;
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241b1e;
    --card:#2f2428;
    --ink:#f2e6e3;
    --mute:#b9a29f;
    --rose:#d49aa5;
    --blush:#45323b;
    --mauve:#b48c9b;
    --berry:#e8a6bd;
    --beige:#3a2e30;
    --line:#4a3a3d;
  }
}

:root[data-theme="dark"]{
  --bg:#241b1e;
  --card:#2f2428;
  --ink:#f2e6e3;
  --mute:#b9a29f;
  --rose:#d49aa5;
  --blush:#45323b;
  --mauve:#b48c9b;
  --berry:#e8a6bd;
  --beige:#3a2e30;
  --line:#4a3a3d;
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.5 "DM Sans",system-ui,sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  opacity:.35;
  pointer-events:none;
  background:#faf5ee;
}

h1,h2,h3{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:600;
  margin:0;
  letter-spacing:.2px;
}

h1{
  font-size:34px;
  line-height:1.1;
}

h2{
  font-size:26px;
}

h3{
  font-size:19px;
}

.deco{
  position:fixed;
  pointer-events:none;
  z-index:0;
  opacity:.5;
}

#app{
  position:relative;
  z-index:1;
  max-width:760px;
  margin:0 auto;
  padding:18px 16px 130px;
}

nav{
  position:fixed;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  background:var(--card);
  border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}

nav button{
  flex:1;
  background:none;
  border:0;
  color:var(--mute);
  font:500 11px "DM Sans",sans-serif;
  padding:6px 0;
  cursor:pointer;
  border-radius:14px;
}

nav button span{
  display:block;
  font-size:20px;
}

nav button.on{
  color:var(--berry);
  background:var(--blush);
}

@media(min-width:900px){
  nav{
    top:0;
    right:auto;
    bottom:0;
    width:130px;
    flex-direction:column;
    justify-content:flex-start;
    gap:6px;
    padding:28px 10px;
    border-top:0;
    border-right:1px solid var(--line);
  }

  #app{
    margin-left:calc(50% - 250px);
    margin-right:auto;
    padding-bottom:60px;
  }
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
  box-shadow:0 1px 6px rgba(122,46,74,.05);
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

.sp{
  justify-content:space-between;
}

.grid{
  display:grid;
  gap:12px;
}

.g2{
  grid-template-columns:1fr 1fr;
}

.g3{
  grid-template-columns:1fr 1fr;
}

@media(min-width:600px){
  .g3{
    grid-template-columns:repeat(3,1fr);
  }
}

.sub{
  color:var(--mute);
  font-size:13px;
}

.big{
  font:600 27px "Cormorant Garamond",serif;
  color:var(--berry);
}

.stat{
  background:var(--blush);
  border-color:transparent;
}

.btn{
  border:0;
  border-radius:99px;
  padding:11px 20px;
  background:var(--berry);
  color:#fff;
  font:600 14px "DM Sans",sans-serif;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  opacity:.88;
}

.btn.soft{
  background:var(--blush);
  color:var(--berry);
}

.btn.sm{
  padding:7px 14px;
  font-size:13px;
}

.btn.ghost{
  background:none;
  color:var(--mute);
  border:1px solid var(--line);
}

input,select,textarea{
  width:100%;
  font:inherit;
  color:var(--ink);
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 13px;
  margin-top:4px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--rose);
}

label{
  display:block;
  font-size:13px;
  color:var(--mute);
  margin-top:12px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:14px;
  gap:10px;
}

.search{
  margin:0 0 16px;
  border-radius:99px;
  padding-left:18px;
}

.item{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px;
  margin-bottom:8px;
  cursor:pointer;
  transition:.2s;
}

.item:hover{
  border-color:var(--rose);
}

.ic{
  width:40px;
  height:40px;
  border-radius:13px;
  background:var(--blush);
  display:grid;
  place-items:center;
  font-size:21px;
  flex:none;
  overflow:hidden;
}

.ic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.amt{
  font-weight:600;
  color:var(--berry);
  white-space:nowrap;
}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:6px;
  margin-bottom:10px;
}

.chip{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:99px;
  padding:7px 14px;
  font:500 13px "DM Sans";
  color:var(--mute);
  white-space:nowrap;
  cursor:pointer;
}

.chip.on{
  background:var(--mauve);
  color:#fff;
  border-color:var(--mauve);
}

.donut{
  width:130px;
  height:130px;
  border-radius:50%;
  flex:none;
  position:relative;
}

.donut:after{
  content:"";
  position:absolute;
  inset:26px;
  background:var(--card);
  border-radius:50%;
}

.bar{
  height:7px;
  background:var(--beige);
  border-radius:9px;
  overflow:hidden;
  margin-top:5px;
}

.bar i{
  display:block;
  height:100%;
  background:var(--rose);
  border-radius:9px;
}

.ph{
  aspect-ratio:4/3;
  border-radius:18px;
  background:linear-gradient(160deg,var(--blush),var(--beige));
  display:grid;
  place-items:center;
  overflow:hidden;
}

.ph img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Compact wishlist cards */
.wl{
  overflow:hidden;
  padding:8px;
  border-radius:18px;
}

.wl .wl-info{
  min-width:0;
  flex:1;
}

.wl .wl-title{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:normal;
}

.wl .wl-price{
  flex-shrink:0;
  white-space:nowrap;
}
   
.tag{
  display:inline-block;
  font-size:12px;
  padding:3px 10px;
  border-radius:99px;
  background:var(--blush);
  color:var(--berry);
  margin:2px 4px 2px 0;
}

.p1{
  border-left:5px solid var(--berry);
}

.p2{
  border-left:5px solid var(--rose);
}

.p3{
  border-left:5px solid var(--line);
}

.gal{
  columns:2;
  gap:12px;
}

@media(min-width:600px){
  .gal{
    columns:3;
  }
}

.gal .card{
  break-inside:avoid;
  margin-bottom:10px;
  padding:6px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:36px 16px;
  color:var(--mute);
}

.empty svg{
  width:70px;
  height:70px;
  color:var(--rose);
  opacity:.7;
}

.fab{
  position:fixed;
  z-index:30;
  right:18px;
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:56px;
  height:56px;
  border-radius:50%;
  border:0;
  background:var(--berry);
  color:#fff;
  font-size:30px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(122,46,74,.3);
}

@media(min-width:900px){
  .fab{
    bottom:28px;
  }
}

.menu{
  position:fixed;
  z-index:30;
  right:18px;
  bottom:calc(150px + env(safe-area-inset-bottom,0px));
  display:none;
  flex-direction:column;
  gap:8px;
}

.menu.open{
  display:flex;
}

@media(min-width:900px){
  .menu{
    bottom:96px;
  }
}

.ov{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(61,42,47,.4);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  background:var(--card);
  width:100%;
  max-width:520px;
  max-height:92vh;
  overflow:auto;
  border-radius:26px 26px 0 0;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));
}

@media(min-width:600px){
  .ov{
    align-items:center;
  }

  .sheet{
    border-radius:26px;
  }
}

.toast{
  position:fixed;
  z-index:99;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  background:var(--berry);
  color:#fff;
  padding:10px 18px;
  border-radius:99px;
  font-size:14px;
}

.rm{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.star{
  color:var(--rose);
}
  #splash{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#faf5ee;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}

.splash-logo{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:64px;
  font-weight:600;
  color:#7a2e4a;
  letter-spacing:.5px;
}

.splash-tagline{
  margin-top:10px;
  max-width:320px;
  font:500 13px/1.8 "DM Sans",system-ui,sans-serif;
  color:#8a7670;
}

#splash.hide{
  opacity:0;
  visibility:hidden;
  transition:opacity .4s ease,visibility .4s ease;
}
   .delete-modal{
  position:fixed;
  inset:0;
  z-index:9999;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(61,42,47,.28);
  backdrop-filter:blur(5px);
}

.delete-modal.show{
  display:flex;
}

.delete-box{
  width:min(360px,100%);
  background:var(--card);

  border:1px solid var(--line);
  border-radius:24px;

  padding:26px 22px 20px;

  text-align:center;

  box-shadow:0 18px 50px rgba(61,42,47,.18);

  animation:deletePop .18s ease-out;
}

.delete-icon{
  width:52px;
  height:52px;

  margin:0 auto 12px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--blush);

  font-size:23px;
}

.delete-box h2{
  margin:0 0 8px;

  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  color:var(--ink);
}

.delete-box p{
  margin:0 0 22px;

  color:var(--mute);
  font-size:14px;
}

.delete-actions{
  display:flex;
  gap:10px;
}

.delete-actions button{
  flex:1;
}

.delete-btn{
  background:var(--berry);
  color:white;
  border:none;
}

.delete-btn:hover{
  opacity:.92;
}

@keyframes deletePop{
  from{
    opacity:0;
    transform:translateY(8px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
</style>
 
</head>

<script>
const K='moneyJournalV1';
const $=s=>document.querySelector(s);

/* =========================================================
   DATA
   ========================================================= */

const def=()=>({
  name:'',
  budget:0,
  income:[],
  ex:[],
  wl:[],
  pu:[],
  xc:[
    '🍽 Food',
    '🛍 Shopping',
    '💄 Beauty',
    '👗 Clothes',
    '📚 Education',
    '🚕 Transportation',
    '📱 Technology',
    '🏠 Home',
    '🎁 Gifts',
    '☕ Drinks',
    '💻 Work',
    '📦 Other'
  ],
  wc:[
    '💄 Beauty',
    '👗 Fashion',
    '📱 Technology',
    '📚 Books',
    '🏠 Home',
    '🎨 Creative',
    '👜 Accessories',
    '🎁 Gifts',
    '🌸 Personal',
    '📦 Other'
  ]
});

let S=def();

try{
  const d=JSON.parse(localStorage.getItem(K));

  if(d){
    S=Object.assign(def(),d);
  }

  if(!Array.isArray(S.income)){
    S.income=[];
  }

  if(!Array.isArray(S.ex)){
    S.ex=[];
  }

  if(!Array.isArray(S.wl)){
    S.wl=[];
  }

  if(!Array.isArray(S.pu)){
    S.pu=[];
  }

  if(!Array.isArray(S.xc)){
    S.xc=def().xc;
  }

  if(!Array.isArray(S.wc)){
    S.wc=def().wc;
  }

  if(typeof S.name!=='string'){
    S.name='';
  }

}catch(e){
  S=def();
}

const save=()=>{
  try{
    localStorage.setItem(K,JSON.stringify(S));
  }catch(e){
    toast('Storage is full — please export a backup and remove some photos');
  }
};

const esc=s=>String(s??'').replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* =========================================================
   LOCAL DATE HELPERS
   ========================================================= */

const dateISO=d=>{
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};

const monthISO=d=>{
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  return `${y}-${m}`;
};

const today=()=>dateISO(new Date());

const fm=n=>Math.round(+n||0).toLocaleString('en-US')+' DA';

const sum=a=>
  a.reduce((s,x)=>s+(+x.a||0),0);

const totalIncome=()=>sum(S.income||[]);

const totalSpent=()=>sum(S.ex||[]);

const balance=()=>{

  const base=Number(S.balanceBase||0);
  const baseTime=Number(S.balanceBaseTime||0);
  const baseDate=S.balanceBaseDate||'';

  if(!baseTime){
    return totalIncome()-totalSpent();
  }

  const incomeAfter=(S.income||[])
    .filter(x=>
      Number(x.createdAt||0)>baseTime &&
      (!baseDate||x.d>=baseDate)
    )
    .reduce((sum,x)=>sum+Number(x.a||0),0);

  const expensesAfter=(S.ex||[])
    .filter(x=>
      Number(x.createdAt||0)>baseTime &&
      (!baseDate||x.d>=baseDate)
    )
    .reduce((sum,x)=>sum+Number(x.a||0),0);

  return base+incomeAfter-expensesAfter;
};
const fd=d=>
  d
  ?new Date(d+'T12:00').toLocaleDateString('en-GB',{
      day:'numeric',
      month:'short'
    })
  :'';

const mname=m=>
  new Date(m+'-15T12:00').toLocaleDateString('en-US',{
    month:'long',
    year:'numeric'
  });

const ico=c=>(c||'📦').split(' ')[0];

const PAL=[
  '#b9707f',
  '#d9a3ad',
  '#a9818f',
  '#7a2e4a',
  '#d8c2a8',
  '#c9a66b',
  '#9aa58a',
  '#e6b8b8'
];

let page='home';
let ym=monthISO(new Date());
let q='';
let F={
  p:'month',
  c:'',
  f:'',
  t:''
};

/* =========================================================
   UI HELPERS
   ========================================================= */

const shift=n=>{
  const d=new Date(ym+'-15T12:00');
  d.setMonth(d.getMonth()+n);
  ym=monthISO(d);
  render();
};

function toast(m){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=m;
  document.body.appendChild(t);

  setTimeout(()=>{
    t.remove();
  },2600);
}

const flower=(c='')=>
  `<svg viewBox="0 0 100 100" style="color:var(--rose)">
    <use href="#fl"/>
  </svg>`;

const empty=t=>
  `<div class="empty">${flower()}<p>${t}</p></div>`;

const photo=(i,cls='ph')=>
  `<div class="${cls}">
    ${
      i.img
      ?`<img src="${i.img}" alt="">`

          style="width:38%;color:var(--rose);opacity:.6">

const byCat=l=>{
  const m={};

  l.forEach(e=>{
    m[e.c]=(m[e.c]||0)+(+e.a||0);
  });

  return Object.entries(m)
    .sort((a,b)=>b[1]-a[1]);
};

function chart(ex){
  const b=byCat(ex);

  if(!b.length){
    return empty('No expenses this month yet.');
  }

  const t=b.reduce((s,x)=>s+x[1],0);
  let acc=0;

  const g=b.map((x,i)=>{
    const s=acc/t*100;
    acc+=x[1];

    return `${PAL[i%8]} ${s}% ${acc/t*100}%`;
  }).join(',');

  return `
    <div class="row" style="align-items:flex-start">
      <div class="donut"
           style="background:conic-gradient(${g})"></div>

      <div style="flex:1;min-width:0">
        ${
          b.slice(0,6).map((x,i)=>`
            <div style="margin-bottom:8px">
              <div class="row sp" style="font-size:14px">
                <span>
                  <span style="color:${PAL[i%8]}">●</span>
                  ${esc(x[0])}
                </span>
                <b>${fm(x[1])}</b>
              </div>

              <div class="bar">
                <i style="
                  width:${x[1]/b[0][1]*100}%;
                  background:${PAL[i%8]}
                "></i>
              </div>
            </div>
          `).join('')
        }
      </div>
    </div>
  `;
}

function go(p){
  page=p;
  q='';

  if($('#sq')){
    $('#sq').value='';
  }

  render();
  scrollTo(0,0);
}let deleteAction = null;

function openDeleteModal(action){

  deleteAction = action;

  const modal = document.getElementById('deleteModal');

  if(!modal){
    return;
  }

  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
}

function closeDeleteModal(){

  const modal = document.getElementById('deleteModal');

  if(!modal){
    return;
  }

  modal.classList.remove('show');
  modal.setAttribute('aria-hidden','true');

  deleteAction = null;
}

function confirmDelete(){

  if(typeof deleteAction === 'function'){

    const action = deleteAction;

    closeDeleteModal();

    action();
  }
}

  $('#nav').innerHTML=[

        ${id?'Edit':'New'} ${FD[t].n}
      </h2>

      <button
        class="btn sm ghost"
        onclick="cl()">
        ✕
      </button>

    </div>

    ${fields(t,it)}

    <label>
      Photo (optional)
    </label>

    <div id="pv"></div>

    <input
      type="file"
      id="ph"
      accept="image/*"
      hidden
      onchange="pick(this.files[0])">

    <div class="rm">

      <button
        class="btn sm soft"
        onclick="$('#ph').click()"
        id="pb">
      </button>

      <button
        class="btn sm ghost"
        id="pd"
        onclick="img='';pv()">
        Delete photo
      </button>

    </div>

    <div
      class="row"
      style="margin-top:20px">

      <button
        class="btn"
        style="flex:1"
        onclick="saveF()">
        Save
      </button>

      ${
        id
        ?`
          <button
            class="btn ghost"
            onclick="del('${t}','${id}')">
            Delete
          </button>
        `
        :''
      }

    </div>
  `);

  pv();
}

function pv(){

  $('#pv').innerHTML=

    img
    ?`
      <div
        class="ph"
        style="margin-top:6px">
        <img src="${img}" alt="">
      </div>
    `
    :'';

  $('#pb').textContent=
    img
    ?'Replace photo'
    :'📷 Take / choose photo';

  $('#pd').style.display=
    img
    ?''
    :'none';
}

function pick(f){

  if(!f)return;

  const r=new FileReader();

  r.onload=()=>{

    const i=new Image();

    i.onload=()=>{

      const s=
        Math.min(
          1,
          720/Math.max(i.width,i.height)
        );

      const c=document.createElement('canvas');

      c.width=i.width*s;
      c.height=i.height*s;

      c.getContext('2d')
        .drawImage(
          i,
          0,
          0,
          c.width,
          c.height
        );

      img=
        c.toDataURL(
          'image/jpeg',
          .72
        );

      pv();
    };

    i.src=r.result;
  };

  r.readAsDataURL(f);
}

function saveF(){

  const {t,id,it}=cur;
  const o={};

  FD[t].f.forEach(([k,,ty])=>{

    let v=$('#f_'+k).value;

    if(ty=='number'){
      v=+v||0;
    }

    if(k=='p'){
      v=+v;
    }

    if(k=='r'){
      v=+v||0;
    }

    o[k]=v;
  });

  if(!o.t&&t!='ex'){
    toast('Please add a name 🌸');
    return;
  }

  if(t=='ex'&&!o.a){
    toast('Please add an amount');
    return;
  }

  if(
    !o.d &&
    FD[t].f.some(f=>f[0]=='d')
  ){
    o.d=today();
  }

  if(t=='wl'&&!o.da){
    o.da=today();
  }

  o.img=img;

  if(id){
  Object.assign(it,o);
}
else{
  o.id=uid();

  if(t=='ex'){
    o.createdAt=Date.now();
  }

  S[t].push(o);
}

  save();
  cl();
  render();
  toast('Saved 🌸');
}

function del(t,id){

  openDeleteModal(()=>{

    S[t]=S[t].filter(x=>x.id!=id);

    save();
    cl();
    render();

    toast('Deleted 🌸');

  });

}
/* =========================================================
   MOVE WISHLIST ITEM TO PURCHASE
   ========================================================= */

function buy(id){

  const w=S.wl.find(x=>x.id==id);

  if(!w){
    return;
  }

  ov(`
    <h2>
      Move to Purchased 🌷
    </h2>

    <div class="sub">
      ${esc(w.t)}
    </div>

    <label>
      Actual price (DA)

      <input
        id="bp"
        type="number"
        inputmode="decimal"
        value="${w.a||''}">
    </label>

    <label>

        id="bd"
        type="date"
        value="${today()}">
    </label>

    <label
      style="display:flex;gap:8px;align-items:center">

        id="be"

    </label>

function doBuy(id){

  const w=S.wl.find(x=>x.id==id);

  if(!w){
    return;
  }

  const a=+$('#bp').value||0;
  const d=$('#bd').value||today();

  S.pu.push({
    id:uid(),
    t:w.t,
    a,
    d,
    c:w.c,
    img:w.img,
    n:w.n,
    r:0,
    b:''
  });

  if($('#be').checked){

    S.ex.push({
      id:uid(),
      t:w.t,
      a,
      d,
      createdAt:Date.now(),
      c:S.xc.find(c=>/Shopping/.test(c))||S.xc[0],
      pm:'Cash',
      n:'',
      img:''
    });

  }

  S.wl=S.wl.filter(x=>x.id!=id);

  save();
  cl();

  page='pu';
  render();

  toast('Moved to Purchases 🌸');
}

  const now=Date.now();

  S.income.push({
    id:uid(),
    a,
    d,
    t,
    n,

  });

  S.balanceBase=a;
  S.balanceBaseDate=d;
  S.balanceBaseTime=now;

  save();
  cl();
  render();

/* =========================================================
   BACKUP / RESTORE
   ========================================================= */

function dl(name,text,type){

  try{

    const u=
      URL.createObjectURL(
        new Blob(
          [text],
          {type:type}
        )
      );

    const a=
      document.createElement('a');

    a.href=u;
    a.download=name;

    document.body.appendChild(a);

    a.click();
    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(u);
    },1500);

    toast('File saved 🌸');

  }catch(e){

    toast('Could not save the file');

  }
}

function exp(k){

  if(k=='json'){

    return dl(
      'money-journal-backup-'+today()+'.json',
      JSON.stringify(S),
      'application/json'
    );

  }

  const r=[
    [
      'Type',
      'Date',
      'Description',
      'Category',
      'Amount (DA)',
      'Payment',
      'Note'
    ]
  ]
  .concat(
    (S.income||[]).map(e=>[
      'Money In',
      e.d,
      e.t,
      '',
      e.a,
      '',
      e.n
    ])
  )
  .concat(
    S.ex.map(e=>[
      'Expense',
      e.d,
      e.t,
      e.c,
      e.a,
      e.pm,
      e.n
    ])
  );

  dl(
    'expenses-'+today()+'.csv',
    '\ufeff'+
    r.map(x=>
      x.map(v=>
        '"'+
        String(v??'')
          .replace(/"/g,'""')+
        '"'
      ).join(',')
    ).join('\n'),
    'text/csv'
  );
}

function imp(f){

  if(!f){
    return;
  }

  const r=new FileReader();

  r.onload=()=>{

    try{

      const d=
        JSON.parse(r.result);

      if(
        !Array.isArray(d.ex)||
        !Array.isArray(d.wl)||
        !Array.isArray(d.pu)
      ){
        throw 0;
      }

      S=Object.assign(
        def(),
        d
      );

      if(!Array.isArray(S.income)){
        S.income=[];
      }

      if(!Array.isArray(S.xc)){
        S.xc=def().xc;
      }

      if(!Array.isArray(S.wc)){
        S.wc=def().wc;
      }

      save();
      render();

      toast('Data restored 🌸');

    }catch(e){

      toast('That file could not be read');

    }

  };

  r.readAsText(f);
}
